name: WASM Plugin

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:
    branches: [ main, dev ]
    
jobs:
  tests:
    name: Tests using tytanic (tt)
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup just
        uses: extractions/setup-just@v4
      - name: Install rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
          override: true
      - name: Run cargo
        run: just plugin
      - name: Run cargo
        uses: actions-rs/cargo@v1
        with:
          use-cross: true
          command: build
          args: --target wasm32-unknown-unknown

